<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Secret For Salina</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300&family=Playfair+Display:wght@500&family=Noto+Serif+Devanagari:wght@500&display=swap" rel="stylesheet">
<script>
// Bina index.html se unlock kiye seedha khulne par wapas bhej do
if(sessionStorage.getItem("salinaUnlocked")!=="yes"){location.replace("index.html")}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#0a0612;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
margin:0;width:100%;
min-height:100vh;min-height:100dvh;
background:radial-gradient(circle at 50% 45%,#2a1233,#0a0612 75%) fixed;
color:white;font-family:'Playfair Display','Noto Serif Devanagari',Georgia,serif;text-align:center;
display:flex;
padding:64px clamp(12px,4vw,16px) 44px;
overflow-x:hidden;
}

/* ---------- floating hearts ---------- */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;color:#f4a9c0;animation:bob ease-in-out infinite}
@keyframes bob{
0%,100%{transform:translate(0,0) rotate(-8deg)}
50%{transform:translate(10px,-16px) rotate(8deg)}
}

/* ---------- card with animated glowing border ---------- */
main{
position:relative;z-index:1;
max-width:520px;width:100%;margin:auto;
padding:clamp(12px,3dvh,24px) clamp(12px,4.5vw,20px);
border:3px solid transparent;border-radius:34px;
background:
radial-gradient(circle at 50% 45%,#5a2f4c,#241632 75%) padding-box,
linear-gradient(120deg,#ff3d6e,#a64dff,#4d7bff,#a64dff,#ff3d6e) border-box;
background-size:100% 100%,300% 300%;
animation:borderMove 6s linear infinite,glow 3s ease-in-out infinite;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:clamp(6px,1.6dvh,14px);
}
@keyframes borderMove{
from{background-position:0 0,0% 50%}
to{background-position:0 0,300% 50%}
}
@keyframes glow{
0%,100%{box-shadow:0 0 30px rgba(255,170,40,.45),0 0 60px rgba(166,77,255,.25)}
50%{box-shadow:0 0 50px rgba(255,170,40,.8),0 0 90px rgba(166,77,255,.45)}
}

#lockPart{
width:100%;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:clamp(6px,1.6dvh,14px);
}
.lock{font-size:clamp(38px,min(13vw,8vh),72px);font-size:clamp(38px,min(13vw,8dvh),72px);line-height:1.1;animation:float 2s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-10px)}}
h1{
color:#ffd1e3;font-size:clamp(22px,8vw,38px);margin:0;
text-shadow:0 0 20px #e86da6;max-width:100%;overflow-wrap:break-word;
}
p{
line-height:1.6;color:#f5dce8;
font-size:clamp(13px,3.9vw,15px);margin:0;
max-width:100%;overflow-wrap:break-word;
}
.lp{font-size:clamp(14px,min(4.6vw,2.7vh),21px);font-size:clamp(14px,min(4.6vw,2.7dvh),21px);line-height:1.4;color:#ffe6f0}
.foot{
font-size:clamp(10px,min(3vw,1.7dvh),14px);letter-spacing:.15em;text-transform:uppercase;
color:#f5dce8;margin-top:clamp(2px,1dvh,8px);
}
input{
width:100%;padding:clamp(10px,min(3.4vw,2dvh),16px);border:1px solid #d58bad;background:#1c1024;color:white;
border-radius:50px;font-size:16px;text-align:center;outline:none;font-family:inherit;
}
input::placeholder{font-family:'Kalam','Noto Serif Devanagari',cursive;font-weight:300;font-size:clamp(15px,min(4.2vw,2.4dvh),19px);color:#9b8aa3}
button,a{
display:inline-block;
background:linear-gradient(120deg,#a94d78,#f0b1ca);color:#2a1020;
border:0;border-radius:30px;padding:14px clamp(16px,6vw,26px);margin:0;
font-size:clamp(13px,4vw,15px);font-family:inherit;
text-decoration:none;cursor:pointer;text-align:center;max-width:100%;
}
#unlockBtn{
padding:clamp(10px,min(3.2vw,2dvh),15px) clamp(18px,6vw,30px);
font-size:clamp(14px,min(4.3vw,2.5dvh),19px);
}
#error{color:#ff9bbd;font-size:clamp(12px,3.6vw,14px);min-height:16px}

#secret{
display:none;width:100%;flex:1;flex-direction:column;justify-content:space-evenly;
gap:12px;animation:reveal .8s;
}
@keyframes reveal{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
#secret h2{
font-size:clamp(21px,7vw,32px);margin:0;color:#ffd1e3;
text-shadow:0 0 20px #e86da6;overflow-wrap:break-word;
}
.note{
display:flex;align-items:center;gap:clamp(10px,3.5vw,14px);
background:#fff0f6;color:#54233c;border-radius:20px;
padding:clamp(12px,4vw,16px) clamp(10px,3.5vw,14px);text-align:left;
box-shadow:0 0 25px #e17ba8;cursor:pointer;transition:box-shadow .3s;
}
.note.playing{box-shadow:0 0 35px #ff6fa5}
.play{
flex:none;width:clamp(48px,15vw,58px);height:clamp(48px,15vw,58px);
padding:0;border-radius:50%;font-size:clamp(18px,5.5vw,22px);
display:flex;align-items:center;justify-content:center;
}
.info{flex:1;min-width:0}
.title{font-weight:bold;font-size:clamp(14px,4.2vw,16px);margin-bottom:0;overflow-wrap:break-word}
.seek{padding:12px 0;cursor:pointer;touch-action:none}
.bar{height:8px;background:#e8b9cf;border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#a94d78,#f0b1ca)}
.time{font-size:clamp(11px,3.3vw,12px);margin-top:0;color:#8a4a6b}

/* Next button: unlock hone ke baad hi dikhega */
#next{display:none}

/* Language button */
#langBtn{
position:fixed;top:10px;right:10px;z-index:20;
margin:0;padding:8px 16px;
font-size:clamp(12px,3.6vw,14px);
background:#211328;color:#ffd4e5;
border:1px solid #d99bb9;border-radius:30px;
box-shadow:0 0 15px #a44d7a;
}

@media (max-height:560px){
.lock{font-size:36px}
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<button id="langBtn" onclick="toggleLang()">हिंदी</button>
<main>
<div id="lockPart">
<div class="lock">🔐</div>
<p class="lp" data-i18n="lockP1"></p>
<p class="lp" data-i18n="lockP2"></p>
<input type="password" id="pass" data-ph="placeholder">
<button id="unlockBtn" onclick="unlock()" data-i18n="unlockBtn"></button>
<p id="error"></p>
<p class="foot" data-i18n="footer"></p>
</div>

<div id="secret">
<h2 data-i18n="surpriseTitle"></h2>
<p data-i18n="surpriseP"></p>

<div class="note" id="n0" onclick="toggle(0)">
<button class="play" id="b0">▶</button>
<div class="info"><div class="title" data-i18n="vn1"></div><div class="seek" id="s0"><div class="bar"><div class="fill" id="f0"></div></div></div><div class="time" id="t0">0:00</div></div>
<audio id="a0" src="voice1.mp3" preload="metadata"></audio>
</div>

<div class="note" id="n1" onclick="toggle(1)">
<button class="play" id="b1">▶</button>
<div class="info"><div class="title" data-i18n="vn2"></div><div class="seek" id="s1"><div class="bar"><div class="fill" id="f1"></div></div></div><div class="time" id="t1">0:00</div></div>
<audio id="a1" src="voice2.mp3" preload="metadata"></audio>
</div>

<p style="font-size:clamp(22px,7vw,26px)">🌹💗🌙</p>
</div>

<a href="finale.html" id="next" data-i18n="nextBtn"></a>
</main>
<script>
// Change this password whenever you want.
const SECRET_PASSWORD="madamji";

// ---------- HINDI / ENGLISH TEXT ----------
const T={
en:{
pageTitle:"A Secret For Salina",
lockP1:"Meri pyari madam jiiii 🌹 ke liye special cheez jo mujhe bahut pehle karne ko bola tha, but uske liye sorrryyyyy",
lockP2:"Love you madam jiiiiiii 🌹",
placeholder:"Enter your secret key...",
unlockBtn:"Unlock your surprise 🔓",
footer:"Crafted with love, for you alone 🌹",
wrong:"Not quite! Try the secret password again. 💗",
surpriseTitle:"Surprise, Salina! ❤️",
surpriseP:"Two little voice notes, just for you. Tap play 🎧",
vn1:"Voice Note 1 💗",
vn2:"Voice Note 2 🌹",
nextBtn:"Next →",
btn:"हिंदी"
},
hi:{
pageTitle:"सलीना के लिए एक राज़",
lockP1:"मेरी प्यारी मैडम जी 🌹 के लिए स्पेशल चीज़ जो मुझे बहुत पहले करने को बोला था, लेकिन उसके लिए सॉरीईईई",
lockP2:"लव यू मैडम जीईईईई 🌹",
placeholder:"अपनी सीक्रेट की डालो...",
unlockBtn:"अपना सरप्राइज़ खोलो 🔓",
footer:"सिर्फ़ तुम्हारे लिए, प्यार से बनाया 🌹",
wrong:"बस थोड़ा सा चूक गईं! सीक्रेट पासवर्ड फिर से डालकर देखो। 💗",
surpriseTitle:"सरप्राइज़, सलीना! ❤️",
surpriseP:"दो छोटे-छोटे वॉइस नोट, सिर्फ़ तुम्हारे लिए। प्ले दबाओ 🎧",
vn1:"वॉइस नोट 1 💗",
vn2:"वॉइस नोट 2 🌹",
nextBtn:"आगे →",
btn:"English"
}
};

let lang="en";
try{
const saved=localStorage.getItem("salinaLang");
if(saved==="hi"||saved==="en")lang=saved;
}catch(e){}

let wrongShown=false;

// ---------- FLOATING HEARTS ----------
(function(){
const bg=document.getElementById("bg");
for(let i=0;i<60;i++){
const s=document.createElement("span");
s.textContent="♥";
s.style.left=(Math.random()*96)+"%";
/* zyada hearts box ke uper aur niche wali jagah me */
const r=Math.random();
s.style.top=(r<.4?Math.random()*14:r<.8?86+Math.random()*12:14+Math.random()*72)+"%";
s.style.fontSize=(14+Math.random()*24)+"px";
s.style.opacity=(.3+Math.random()*.5).toFixed(2);
s.style.animationDuration=(3+Math.random()*4)+"s";
s.style.animationDelay=(-Math.random()*6)+"s";
bg.appendChild(s);
}
})();

function applyLang(){
document.documentElement.lang=lang;
document.title=T[lang].pageTitle;
document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=T[lang][el.getAttribute("data-i18n")];
});
document.querySelectorAll("[data-ph]").forEach(el=>{
el.placeholder=T[lang][el.getAttribute("data-ph")];
});
document.getElementById("langBtn").textContent=T[lang].btn;
if(wrongShown)document.getElementById("error").textContent=T[lang].wrong;
}

function toggleLang(){
lang=(lang==="en")?"hi":"en";
try{localStorage.setItem("salinaLang",lang)}catch(e){}
applyLang();
}

function unlock(){
const entered=document.getElementById("pass").value;
if(entered===SECRET_PASSWORD){
document.getElementById("lockPart").style.display="none";
document.getElementById("secret").style.display="flex";
document.getElementById("next").style.display="inline-block";
}else{
wrongShown=true;
document.getElementById("error").textContent=T[lang].wrong;
}
}
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});

function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

let current=-1;

function setState(i,playing){
document.getElementById("b"+i).textContent=playing?"⏸":"▶";
document.getElementById("n"+i).classList.toggle("playing",playing);
}

function toggle(i){
if(current===i){
document.getElementById("a"+i).pause();
setState(i,false);
current=-1;
return;
}
if(current!==-1){
document.getElementById("a"+current).pause();
setState(current,false);
}
const a=document.getElementById("a"+i);
const p=a.play();
if(p&&p.catch){p.catch(()=>{setState(i,false);if(current===i)current=-1})}
setState(i,true);
current=i;
}

for(let i=0;i<2;i++){
const a=document.getElementById("a"+i);
const t=document.getElementById("t"+i);
a.addEventListener("timeupdate",()=>{
document.getElementById("f"+i).style.width=(a.duration?a.currentTime/a.duration*100:0)+"%";
t.textContent=fmt(a.currentTime)+" / "+fmt(a.duration);
});
a.addEventListener("loadedmetadata",()=>{t.textContent="0:00 / "+fmt(a.duration)});
a.addEventListener("ended",()=>{setState(i,false);if(current===i)current=-1});

const sk=document.getElementById("s"+i);
let drag=false;
function seek(e){
if(!a.duration)return;
const r=sk.getBoundingClientRect();
const x=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
a.currentTime=x*a.duration;
}
sk.addEventListener("pointerdown",e=>{
e.stopPropagation();
drag=true;
try{sk.setPointerCapture(e.pointerId)}catch(err){}
seek(e);
});
sk.addEventListener("pointermove",e=>{if(drag)seek(e)});
sk.addEventListener("pointerup",()=>{drag=false});
sk.addEventListener("pointercancel",()=>{drag=false});
sk.addEventListener("click",e=>e.stopPropagation());
}

applyLang();
</script>
</body>
</html>
