/* ================= FLOATING HEARTS BACKGROUND ================= */

.bg{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
}

.bg span{
position:absolute;
color:#f4a9c0;
opacity:.45;
animation:drift linear infinite;
}

@keyframes drift{
from{transform:translateY(0)}
to{transform:translateY(-110vh)}
}

/* ================= BOW ================= */

.bow{
position:fixed;
top:0;
right:-6px;
width:125px;
z-index:1;
pointer-events:none;
}

/* ================= LAYOUT ================= */

main{
position:fixed;
inset:0;
z-index:2;
overflow:hidden;
}

#s1{
position:absolute;
inset:0;
transition:opacity .6s ease;
}

#s1.out{
opacity:0;
pointer-events:none;
}

/* ================= TITLE ================= */

.hero{
position:absolute;
left:0;
right:0;
top:11%;
display:flex;
flex-direction:column;
align-items:center;
padding:0 16px;
font-family:'Great Vibes','Kalam',cursive;
}

.hb{
font-size:calc(clamp(26px,min(8vw,4.4vh),40px)*var(--f));
letter-spacing:1px;
color:#ffc2d6;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

.hn{
font-size:calc(clamp(56px,min(19vw,10vh),92px)*var(--f));
line-height:1.1;
margin-top:2px;

/* fix: Salina cut ho raha tha */
padding:.2em .28em .14em;
margin-top:calc(2px - .2em);
margin-bottom:-.14em;

background:linear-gradient(180deg,#ffb3d1 10%,#ff6fa5 100%);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
-webkit-text-fill-color:transparent;

filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));
}

/* ================= CAKE POSITION ================= */

.cakewrap{
position:absolute;
left:50%;
bottom:45.5%;
transform:translateX(-50%);
width:calc(230px*var(--s));
height:calc(251px*var(--s));
}

.cake{
position:absolute;
top:0;
left:0;
width:230px;
height:251px;
transform:scale(var(--s));
transform-origin:top left;
}

.mist{
position:absolute;
left:-48px;
bottom:-16px;
width:326px;
height:50px;
pointer-events:none;

background:radial-gradient(
ellipse at 50% 50%,
rgba(240,130,170,.45) 0,
rgba(244,170,200,.2) 38%,
transparent 70%
);
}

/* ================= HEARTS ================= */

.fh{
position:absolute;
width:30px;
height:28px;
pointer-events:none;
animation:floaty 3.2s ease-in-out infinite;
filter:drop-shadow(0 2px 5px rgba(228,111,151,.55));
}

.fh.s{
width:20px;
height:19px;
}

.fh svg{
width:100%;
height:100%;
display:block;
}

.fh.h1{left:-6px;top:80px}
.fh.h2{left:-44px;top:152px;animation-delay:-1.1s}
.fh.h3{left:208px;top:74px;animation-delay:-.6s}
.fh.h4{left:250px;top:150px;animation-delay:-2s}

@keyframes floaty{
0%,100%{transform:translateY(0);opacity:.85}
50%{transform:translateY(-7px);opacity:1}
}

/* ================= WISH TEXT ================= */

.wishbox{
position:absolute;
left:0;
right:0;
top:calc(54.5% + 14px);
display:flex;
flex-direction:column;
align-items:center;
padding:0 16px;
}

h2{
font-family:'Great Vibes','Kalam',cursive;
font-weight:400;
font-size:calc(clamp(24px,min(7.4vw,4.2vh),36px)*var(--f));
margin:0;
color:#ffc2d6;
max-width:100%;
overflow-wrap:break-word;
line-height:1.25;
text-shadow:0 2px 8px rgba(0,0,0,.7);
}

.amp{
display:flex;
align-items:center;
gap:7px;
width:min(80vw,360px);
margin-top:2px;
color:#ff9fbf;
font-size:calc(clamp(20px,min(6.5vw,3.4vh),30px)*var(--f));
line-height:1.1;
}

.amp .ln{
flex:1;
height:1px;
background:linear-gradient(
90deg,
rgba(228,111,151,0),
rgba(228,111,151,.9)
);
}

.amp .ln.r{
background:linear-gradient(
90deg,
rgba(228,111,151,.9),
rgba(228,111,151,0)
);
}

.amp .ln.sh{flex:0 0 14px}

.amp .hrt{
font-size:.62em;
color:#e46f97;
}

/* ================= WISH BUTTON ================= */

#wishBtn{
margin-top:clamp(14px,3vh,26px);
width:min(88vw,340px);
white-space:nowrap;
padding:12px 14px;
font-size:calc(clamp(13px,4vw,18px)*var(--f));
}

/* ================= SECOND SCREEN (SCROLLABLE) ================= */

#s2{
display:none;
position:absolute;
left:0;
right:0;
top:0;
bottom:0;

padding:var(--txtTop) clamp(14px,5vw,50px) 60px;

flex-direction:column;
align-items:center;
justify-content:flex-start;

overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;

<script>

/* ================= ENGLISH / HINDI ================= */

const LY1="🎀 Happy Birthday to you,\nHappy Birthday, My Love! 🌹\nHappy Birthday dear Salina,\nHappy birthday to youuuuuuuu 💞\nHappy Birthday, Madam Jiiiiiiiiiiiii ! 🎀";

const LY2="May all your dreams come true,\nMay happiness always stay by your side,\nMay your smile keep shining just like this,\nAnd may every wish of yours come true! 💗";

const LY3="You are truly special, you are one of a kind,\nSending you lots of love from afar,\nMay your life always be filled with light,\nAnd may every day bring sweetness and happiness! 🌷";

const LY4="May every new day of your life bring you a new reason to smile,\nMay you never feel the absence of anything,\nWherever you are, may you always stay happy,\nAnd may every moment ahead be even more beautiful than today. 💖";

const LY5="May your face always carry a smile,\nMay your eyes always shine with beautiful dreams,\nAnd may your world always be filled with love, peace, and happiness. 🌷";

/* Hindi lyrics */

const HLY2="तुम्हारे सारे सपने सच हों,\nखुशियाँ हमेशा तुम्हारे साथ रहें,\nतुम्हारी मुस्कान यूँ ही चमकती रहे,\nऔर तुम्हारी हर ख्वाहिश पूरी हो! 💗";

const HLY3="तुम सच में खास हो, तुम बेमिसाल हो,\nदूर से ढेर सारा प्यार भेज रहा हूँ,\nतुम्हारी ज़िंदगी हमेशा रौशनी से भरी रहे,\nऔर हर दिन मिठास और खुशियाँ लेकर आए! 🌷";

const HLY4="तुम्हारी ज़िंदगी का हर नया दिन तुम्हें मुस्कुराने की एक नई वजह दे,\nतुम्हें कभी किसी चीज़ की कमी महसूस न हो,\nतुम जहाँ भी रहो, हमेशा खुश रहो,\nऔर आने वाला हर पल आज से भी ज़्यादा खूबसूरत हो। 💖";

const HLY5="तुम्हारे चेहरे पर हमेशा मुस्कान रहे,\nतुम्हारी आँखों में हमेशा खूबसूरत सपने चमकते रहें,\nऔर तुम्हारी दुनिया हमेशा प्यार, सुकून और खुशियों से भरी रहे। 🌷";

const T={

en:{
pageTitle:"Happy Birthday Salina",

heroA:"Happy Birthday",
heroB:"Salina",

roses:"🌹 A Little World, Made Just For You 🌹",

title:"Happy Birthday,\nMy Beautiful Salina! ❤️",

ly1:LY1,
ly2:LY2,
ly3:LY3,
ly4:LY4,
ly5:LY5,

p1:"If I could give you one thing in this world, it would be the ability to see yourself through my eyes.",

p2:"Then you would understand how special you are, how beautiful your smile is, and how much happiness you bring into my life.",

p3:"Today, this little world belongs to you. Every word, every animation, every little surprise is made with one wish: to see you smile. 💕",

wish:"Close your eyes, my love...",

wishDone:"Your wish is on its way to the universe ✨",

extra:"I love yoouuuuuuuuuuuuu\nSooooo Muuccchhhhhhh\nBabbbbbbyyyyyyyyyyy 😘",

blowBtn:"Make Your Wish, Princess 🕯️",

memBtn:"Our Little World Together → ❤️",

btn:"हिंदी"
},

hi:{
pageTitle:"जन्मदिन मुबारक सलीना",

heroA:"जन्मदिन मुबारक",
heroB:"सलीना",

roses:"🌹 एक छोटी सी दुनिया, सिर्फ़ तुम्हारे लिए 🌹",

title:"जन्मदिन मुबारक,\nमेरी प्यारी सलीना! ❤️",

ly1:LY1,
ly2:HLY2,
ly3:HLY3,
ly4:HLY4,
ly5:HLY5,

p1:"अगर मैं तुम्हें इस दुनिया में एक चीज़ दे पाता, तो वो होती खुद को मेरी नज़रों से देख पाने की ताक़त।",

p2:"तब तुम समझ पातीं कि तुम कितनी खास हो, तुम्हारी मुस्कान कितनी खूबसूरत है, और तुम मेरी ज़िंदगी में कितनी खुशियाँ लाती हो।",

p3:"आज ये छोटी सी दुनिया तुम्हारी है। हर शब्द, हर एनिमेशन, हर छोटा सरप्राइज़ बस एक ख्वाहिश के साथ बना है: तुम्हें मुस्कुराते देखना। 💕",

wish:"आँखें बंद करो, मेरी जान...",

wishDone:"तुम्हारी विश ब्रह्मांड तक पहुँच रही है ✨",

extra:"आई लव यूऊऊऊऊऊऊऊ\nबहुत सारा प्यार\nबेबीईईईईईईईई 😘",

blowBtn:"विश माँगो, प्रिंसेस 🕯️",

memBtn:"हमारी छोटी सी दुनिया साथ में → ❤️",

btn:"English"
}

};

let lang="en";

try{
const saved=localStorage.getItem("salinaLang");

if(saved==="hi"||saved==="en"){
lang=saved;
}

}catch(e){}

let blown=false;

/* ================= BACKGROUND HEARTS ================= */

(function(){
const bg=document.getElementById("bg");
for(let i=0;i<18;i++){
const s=document.createElement("span");
s.textContent="♥";
s.style.left=Math.random()*100+"%";
s.style.top=(100+Math.random()*20)+"vh";
s.style.fontSize=(10+Math.random()*16)+"px";
s.style.animationDuration=(14+Math.random()*16)+"s";
s.style.animationDelay=(-Math.random()*20)+"s";
bg.appendChild(s);
}
})();

/* ================= FIT SCREEN ================= */

function fit(){

const root=document.documentElement.style;

const vw=window.innerWidth;
const vh=window.innerHeight;

const s=Math.max(
.34,
Math.min(.8,.5*vw/230,vh*0.00096)
);

root.setProperty("--s",s.toFixed(2));

const f=Math.max(.7,Math.min(1,vh/600,vw/320));

root.setProperty("--f",f.toFixed(2));

}

/* ================= APPLY LANGUAGE ================= */

function applyLang(){

document.documentElement.lang=lang;

document.title=T[lang].pageTitle;

document.querySelectorAll("[data-i18n]").forEach(el=>{

el.textContent=T[lang][el.getAttribute("data-i18n")];

});

document.getElementById("langBtn").textContent=T[lang].btn;

document.getElementById("wish").textContent=
blown?T[lang].wishDone:T[lang].wish;

fit();

}

function toggleLang(){

lang=(lang==="en")?"hi":"en";

try{
localStorage.setItem("salinaLang",lang);
}catch(e){}

applyLang();

}

/* ================= BLOW CANDLE ================= */

function blow(){

if(blown)return;

blown=true;

document.getElementById("flame").style.display="none";

applyLang();

/* Falling particles */

for(let i=0;i<85;i++){

let e=document.createElement("span");

e.textContent=["✨","💗","🌸","🎉","⭐"][i%5];

e.style.cssText=
`position:fixed;
left:${Math.random()*92}vw;
top:${Math.random()*92}vh;
font-size:${15+Math.random()*25}px;
pointer-events:none;
animation:fall 2s forwards`;

document.body.append(e);

setTimeout(()=>e.remove(),2200);

}

/* Screen transition */

const s1=document.getElementById("s1");
const s2=document.getElementById("s2");

s1.classList.add("out");

setTimeout(()=>{

s1.style.display="none";

document.getElementById("bg").style.display="none";

document.querySelector(".bow").style.display="none";

s2.style.display="flex";

document.getElementById("rosebg").classList.add("show");

fit();

void s2.offsetWidth;

s2.classList.add("go");

s2.addEventListener("animationend",startAutoScroll,{once:true});

},650);

}

/* ================= AUTO SCROLL TO NEXT BUTTON ================= */

let autoStop=false;

function showNext(){

const s2=document.getElementById("s2");

if(s2.scrollTop+s2.clientHeight>=s2.scrollHeight-8){
document.getElementById("nextBtn").classList.add("show");
}

}

function startAutoScroll(){

const s2=document.getElementById("s2");

const speed=38; /* px per second */

const startTop=s2.scrollTop;
const t0=performance.now();

function stop(){
autoStop=true;
}

["touchstart","wheel","mousedown"].forEach(ev=>{
s2.addEventListener(ev,stop,{passive:true,once:true});
});

s2.addEventListener("scroll",showNext,{passive:true});

function step(now){

if(autoStop){
showNext();
return;
}

const max=s2.scrollHeight-s2.clientHeight;

const y=startTop+(now-t0)/1000*speed;

if(y>=max){
s2.scrollTop=max;
showNext();
return;
}

s2.scrollTop=y;

requestAnimationFrame(step);

}

requestAnimationFrame(step);

}

/* ================= INITIALIZE ================= */

applyLang();

window.addEventListener("resize",fit);

window.addEventListener(
"orientationchange",
()=>setTimeout(fit,200)
);

window.addEventListener("load",fit);

</script>
