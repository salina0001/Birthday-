<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080F2B">
<title>Her Little Universe</title>

<script>
if(sessionStorage.getItem("salinaUnlocked")!=="yes"){
location.replace("index.html");
}
</script>

<style>
*{box-sizing:border-box}

:root{
--f:1;
--pink:#e9a8c5;
--purple:#b86c98;
--light:#ffe0ed;
}

html{
height:100%;
background:#080F2B;
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

body{
margin:0;
min-height:100vh;
min-height:100dvh;
width:100%;
color:#fff0e9;
font-family:Georgia,'Noto Serif Devanagari',serif;
text-align:center;
overflow-x:hidden;
overflow-y:auto;

background:
radial-gradient(ellipse at 50% 10%,#1b2850 0%,transparent 43%),
radial-gradient(ellipse at 0% 60%,#111e40 0%,transparent 38%),
radial-gradient(ellipse at 100% 75%,#172448 0%,transparent 38%),
radial-gradient(ellipse at 50% 100%,#202d55 0%,transparent 48%),
#080F2B;
}

/* MAGICAL BACKGROUND */

#magicDecor{
position:fixed;
inset:0;
z-index:0;
overflow:hidden;
pointer-events:none;

background-image:
radial-gradient(2px 2px at 10% 12%,#dce8ff 99%,transparent),
radial-gradient(2px 2px at 25% 35%,#849bc9 99%,transparent),
radial-gradient(2px 2px at 80% 18%,#e8efff 99%,transparent),
radial-gradient(2px 2px at 65% 52%,#9aafd9 99%,transparent),
radial-gradient(2px 2px at 92% 68%,#dce8ff 99%,transparent),
radial-gradient(2px 2px at 18% 80%,#849bc9 99%,transparent),
radial-gradient(2px 2px at 45% 90%,#e8efff 99%,transparent);

background-size:230px 250px;
animation:stars 12s linear infinite;
}

@keyframes stars{
0%{background-position:0 0}
100%{background-position:0 250px}
}

/* MOON */

.moon{
position:absolute;
top:8%;
right:5%;
width:65px;
height:65px;
border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fff5f8,#e9b5cc 45%,#b76c91 80%);
box-shadow:0 0 20px #e6a7c2,0 0 45px #a95d83;
opacity:.85;
animation:moonGlow 4s ease-in-out infinite alternate;
}

@keyframes moonGlow{
from{box-shadow:0 0 15px #d99bb7,0 0 30px #a95d83}
to{box-shadow:0 0 30px #f2c2d5,0 0 55px #b86c98}
}

/* HANGING FLOWERS */

.hanging{
position:absolute;
top:0;
width:75px;
height:150px;
opacity:.65;

background:
radial-gradient(ellipse,#e9a0be 0 30%,transparent 35%) 10px 50px/22px 25px,
radial-gradient(ellipse,#b76b92 0 30%,transparent 35%) 30px 75px/22px 25px,
radial-gradient(ellipse,#e9a0be 0 30%,transparent 35%) 5px 100px/22px 25px,
linear-gradient(90deg,transparent 48%,#b87998 49% 51%,transparent 52%) center top/2px 100% no-repeat;
}

.hanging.left{left:0}
.hanging.right{right:0;transform:scaleX(-1);height:120px}

/* BUTTERFLIES */

.butterfly{
position:absolute;
font-size:25px;
filter:drop-shadow(0 0 9px #d69ab5);
animation:fly 6s ease-in-out infinite;
}

.b1{top:18%;left:5%}
.b2{top:32%;right:7%;animation-delay:1s}
.b3{bottom:22%;left:7%;animation-delay:2s}
.b4{bottom:35%;right:5%;animation-delay:3s}

@keyframes fly{
0%,100%{transform:translateY(0) rotate(-8deg)}
50%{transform:translateY(-17px) rotate(10deg)}
}

/* FLOATING HEARTS */

.heart{
position:absolute;
color:#e9a6c2;
font-size:23px;
text-shadow:0 0 12px #d58ba9;
animation:heartFloat 5s ease-in-out infinite;
}

.h1{top:43%;left:3%}
.h2{top:57%;right:3%;animation-delay:2s}
.h3{bottom:12%;left:25%;animation-delay:1s}

@keyframes heartFloat{
0%,100%{transform:translateY(0) scale(.9);opacity:.6}
50%{transform:translateY(-15px) scale(1.15);opacity:1}
}

/* ROSES */

.roseDecor{
position:absolute;
bottom:-10px;
left:-12px;
font-size:65px;
filter:drop-shadow(0 0 15px #d58ba9);
opacity:.8;
animation:roseGlow 4s ease-in-out infinite alternate;
}

@keyframes roseGlow{
from{filter:drop-shadow(0 0 8px #b86c98)}
to{filter:drop-shadow(0 0 23px #e9a6c2)}
}

/* JAR */

.jar{
position:absolute;
bottom:15px;
right:8px;
font-size:65px;
filter:drop-shadow(0 0 16px #d69ab5);
animation:jarGlow 3s ease-in-out infinite alternate;
}

@keyframes jarGlow{
from{transform:scale(.97)}
to{transform:scale(1.05)}
}

/* MAIN CONTENT */

main{
position:relative;
z-index:1;
min-height:100vh;
min-height:100dvh;
height:100vh;
height:100dvh;

padding:clamp(48px,7vh,58px) 12px clamp(10px,2vh,16px);

display:flex;
flex-direction:column;
align-items:center;
gap:clamp(6px,1.3vh,11px);
}

/* HEADING */

h1{
font-size:calc(clamp(19px,min(6.3vw,3.9vh),32px)*var(--f));
margin:0;
color:#fff0e8;

text-shadow:
0 2px 3px #080F2B,
0 0 7px #9b526f,
0 0 15px #d69ab5;

line-height:1.2;
max-width:100%;
overflow-wrap:break-word;
flex:none;

animation:titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow{
from{
text-shadow:
0 2px 3px #080F2B,
0 0 7px #9b526f,
0 0 15px #d69ab5;
}
to{
text-shadow:
0 2px 3px #080F2B,
0 0 10px #fff0e8,
0 0 22px #d69ab5;
}
}

/* PARAGRAPH */

p{
color:#fff0e9;
line-height:1.35;
font-size:calc(clamp(12px,min(3.6vw,2.1vh),15px)*var(--f));
margin:0;
max-width:100%;
overflow-wrap:break-word;
flex:none;

text-shadow:
0 1px 3px #080F2B,
0 0 8px #9c657d;
}

/* LANGUAGE BUTTON */

#langBtn{
position:fixed;
top:10px;
right:10px;
z-index:20;
padding:8px 16px;
font-size:clamp(12px,3.6vw,14px);

background:#172448dd;
color:#fff0e9;

border:1px solid #829bc9;
border-radius:30px;
box-shadow:0 0 15px #526b9d;
}

/* PHOTO GALLERY */

.gallery{
flex:1 1 0;
min-height:0;
width:100%;
max-width:800px;

display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
grid-template-rows:repeat(2,minmax(0,1fr));

gap:clamp(7px,2.4vw,12px);
}

/* PHOTO CARD */

.card{
display:flex;
flex-direction:column;
min-height:0;
min-width:0;
padding:clamp(5px,1.4vw,7px);

background:linear-gradient(
145deg,
#75445f 0%,
#4c2a40 55%,
#382137 100%
);

border:1.5px solid #c58ba7;
border-radius:17px;

box-shadow:
0 0 7px #c58ba7,
0 0 17px #9c617c66,
inset 0 0 14px #e9b5cc22;

transition:transform .35s,box-shadow .35s;
cursor:pointer;
overflow:hidden;

animation:cardGlow 4s ease-in-out infinite alternate;
}

/* ANIMATED BORDER */

@keyframes cardGlow{
0%{
border-color:#c58ba7;
box-shadow:0 0 6px #c58ba7,0 0 12px #9c617c55,inset 0 0 14px #e9b5cc22;
}
35%{
border-color:#e6a8c2;
box-shadow:0 0 10px #e6a8c2,0 0 20px #c17c9d77,inset 0 0 14px #f1c1d333;
}
70%{
border-color:#d7b49d;
box-shadow:0 0 8px #d7b49d,0 0 17px #b98b7555,inset 0 0 14px #e9b5cc22;
}
100%{
border-color:#bca0c4;
box-shadow:0 0 10px #bca0c4,0 0 20px #a18aaf66,inset 0 0 14px #e9b5cc22;
}
}

.card:hover{
transform:translateY(-3px) scale(1.01);
box-shadow:0 0 25px #dba2ba;
}

/* PHOTO */

.card img{
display:block;
width:100%;
flex:1 1 0;
min-height:0;

object-fit:cover;
object-position:center top;
border-radius:11px;

background:linear-gradient(140deg,#70465f,#382438);

font-size:12px;
color:#fff0e9;
}

/* PHOTO CAPTIONS */

.txt{
flex:none;
padding:clamp(3px,.8vh,7px) 2px 1px;
}

.ct{
color:#fff1e9;
font-weight:bold;
font-size:calc(clamp(11px,min(3.4vw,2vh),14px)*var(--f));
line-height:1.2;
overflow-wrap:break-word;

text-shadow:
0 1px 3px #080F2B,
0 0 8px #b97897;
}

/* PHOTO VIEWER */

#viewer{
display:none;
position:fixed;
inset:0;
background:#080F2BF2;
z-index:25;
align-items:center;
justify-content:center;
padding:20px;
}

#viewer img{
max-width:95%;
max-height:85vh;
max-height:85dvh;

border:2px solid #dba3bb;
border-radius:12px;
box-shadow:0 0 25px #c58ba7;
}

#viewer button{
position:absolute;
top:20px;
right:20px;
}

/* BUTTONS */

button,.btn{
background:linear-gradient(120deg,#b45f89,#e8a6c1);
color:#321b2a;
border:1px solid #efc2d5;
border-radius:30px;

padding:clamp(8px,1.6vh,12px) clamp(18px,6vw,26px);
margin:0;

font-size:calc(clamp(12px,3.9vw,15px)*var(--f));
font-family:inherit;
text-decoration:none;
cursor:pointer;

box-shadow:0 0 13px #c58ba7;
}

.next{
flex:none;
white-space:nowrap;
box-shadow:0 0 15px #c58ba7,0 5px 20px #0009;
transition:.3s;
}

.next:active{
transform:scale(.96);
}

/* SMALL SCREEN */

@media(max-width:360px){
main{
padding-left:9px;
padding-right:9px;
}

.gallery{gap:7px}

.card{
padding:4px;
border-radius:13px;
}

.moon{
width:48px;
height:48px;
}

.roseDecor,.jar{font-size:48px}
.butterfly{font-size:20px}
}

/* REDUCE MOTION ACCESSIBILITY */

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;
animation-iteration-count:1!important;
scroll-behavior:auto!important;
}
}

</style>
</head>

<body>

<div id="magicDecor" aria-hidden="true">

<div class="moon"></div>

<div class="hanging left"></div>
<div class="hanging right"></div>

<div class="butterfly b1">🦋</div>
<div class="butterfly b2">🦋</div>
<div class="butterfly b3">🦋</div>
<div class="butterfly b4">🦋</div>

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>

<div class="roseDecor">🌹</div>
<div class="jar">🏺</div>

</div>

<button id="langBtn" onclick="toggleLang()">हिंदी</button>

<main id="main">

<h1 data-i18n="title"></h1>

<p data-i18n="intro"></p>

<div class="gallery" id="gallery">

<div class="card" onclick="show(this)">
<img src="salina1.jpg" alt="Salina 1">
<div class="txt">
<div class="ct" data-i18n="t1"></div>
</div>
</div>

<div class="card" onclick="show(this)">
<img src="salina2.jpg" alt="Salina 2">
<div class="txt">
<div class="ct" data-i18n="t2"></div>
</div>
</div>

<div class="card" onclick="show(this)">
<img src="salina3.jpg" alt="Salina 3">
<div class="txt">
<div class="ct" data-i18n="t3"></div>
</div>
</div>

<div class="card" onclick="show(this)">
<img src="salina4.jpg" alt="Salina 4">
<div class="txt">
<div class="ct" data-i18n="t4"></div>
</div>
</div>

</div>

<p data-i18n="outro"></p>

<a class="btn next" href="story.html" data-i18n="nextBtn"></a>

</main>

<div id="viewer" onclick="this.style.display='none'">

<button data-i18n="closeBtn"></button>

<img id="large" alt="Full size memory">

</div>

<script>

// ---------- HINDI / ENGLISH TEXT ----------

const T={

en:{
pageTitle:"Her Little Universe",
title:"my birthday girrlllll 💫",
intro:"Four little windows into a world that looks more beautiful with you in it.",
t1:"Mine ✨",
t2:"Madam jiiiii 🌹",
t3:"my babbyyyy 💞",
t4:"Always My Person 🧸",
outro:"And the best memories are still waiting to happen...",
nextBtn:" Next →",
closeBtn:"✕ Close",
btn:"हिंदी"
},

hi:{
pageTitle:"उसकी छोटी सी दुनिया",
title:"my birthday girrlllll 💫",
intro:"चार छोटी खिड़कियाँ एक ऐसी दुनिया में, जो तुम्हारे होने से और भी खूबसूरत लगती है।",
t1:"Mine ✨",
t2:"Madam jiiiii 🌹",
t3:"my babbyyyy 💞",
t4:"Always My Person 🧸",
outro:"और सबसे हसीन यादें अभी बननी बाकी हैं...",
nextBtn:"Next →",
closeBtn:"✕ बंद करो",
btn:"English"
}

};

let lang="en";

try{
const saved=localStorage.getItem("salinaLang");
if(saved==="hi"||saved==="en")lang=saved;
}catch(e){}

// ---------- SCREEN FIT ----------

function tooBig(){

if(document.documentElement.scrollHeight>window.innerHeight+2){
return true;
}

const cards=document.querySelectorAll(".card");

for(let i=0;i<cards.length;i++){

const c=cards[i];
const img=c.querySelector("img");

if(img.clientHeight<55)return true;

if(c.scrollHeight>c.clientHeight+1)return true;

}

return false;

}

function fit(){

const root=document.documentElement.style;

const fs=[1,.94,.88,.82,.76,.7];

for(let a=0;a<fs.length;a++){

root.setProperty("--f",fs[a]);

if(!tooBig())return;

}

}

// ---------- APPLY LANGUAGE ----------

function applyLang(){

document.documentElement.lang=lang;
document.title=T[lang].pageTitle;

document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=T[lang][el.getAttribute("data-i18n")];
});

document.getElementById("langBtn").textContent=T[lang].btn;

fit();

}

// ---------- TOGGLE LANGUAGE ----------

function toggleLang(){

lang=(lang==="en")?"hi":"en";

try{
localStorage.setItem("salinaLang",lang);
}catch(e){}

applyLang();

}

// ---------- PHOTO VIEWER ----------

function show(card){

const img=card.querySelector("img");

if(!img.complete || img.naturalWidth===0){
return;
}

document.getElementById("large").src=img.src;
document.getElementById("viewer").style.display="flex";

}

// ---------- INITIALIZE ----------

applyLang();

window.addEventListener("resize",fit);

window.addEventListener("orientationchange",()=>{
setTimeout(fit,200);
});

window.addEventListener("load",fit);

</script>

</body>
</html>
